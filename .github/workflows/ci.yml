name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si subes otro commit al mismo PR, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'          # la misma de gradle-daemon-jvm.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json desde el secreto
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" | base64 -d > app/google-services.json

      - name: Compilar, probar y revisar
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: app/build/reports/